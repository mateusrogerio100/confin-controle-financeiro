# Alternativa ao "npm run db:local" para quem tem Docker instalado.
# Uso: docker compose up -d   (mesma URL do .env.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: confin
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
